name: 提问 / 求助
description: 使用、投稿、分类上的疑问；提交后 AI 助手会自动回复
title: "[提问] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提交后 AI 助手会先自动回复一次，维护者有空时再跟进。
        提问前建议先看一眼 [贡献指南](https://github.com/miaoxintechnology/physics-demo-xinsheng-plan/blob/main/CONTRIBUTING.md)。

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 写清楚场景，AI 才能答得准。
      placeholder: 例如：初中光学「凸透镜成像」里，蜡烛放在两倍焦距外时，光屏为什么要移到一倍到两倍之间？
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 涉及的学段
      options:
        - 初中
        - 高中
        - 与学段无关（投稿 / 仓库使用）
    validations:
      required: true

  - type: input
    id: ai_trigger
    attributes:
      label: AI 触发标记
      description: 这一行是给自动回复用的，保留 @infer 即可；改成别的内容就不会触发自动回复。
      value: "@infer"
    validations:
      required: true
