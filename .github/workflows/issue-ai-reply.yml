name: AI Reply on Issues & Comments

# 纯问答通道：新 Issue 自动回答；Issue 或 PR 的评论里 @deepseek 追问也走这里。
# 只调用 DeepSeek 接口发评论，不读仓库、不改代码、不开 PR。
# 需要 AI 改文件 / 开 PR 时用 @infer，那走 issue-ai-code.yml。
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

# 同一 Issue 串行，不取消已开始的运行：每条提问最终都会有回答
concurrency:
  group: ai-reply-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    # 1. 不响应 Bot，防止循环
    # 2. Issue 和 PR 的评论都支持（新 Issue 默认走问答）
    # 3. 新 Issue 正文把 @deepseek 改成 @infer 则交给代码通道
    # 4. 评论必须是 @deepseek 且不是 @infer
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'issues' &&
        !contains(github.event.issue.body, '@infer')) ||
       (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@deepseek') &&
        !contains(github.event.comment.body, '@infer')))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 向 DeepSeek 提问并回复
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const key = process.env.DEEPSEEK_API_KEY;
            if (!key) {
              core.setFailed(
                "仓库未配置 DEEPSEEK_API_KEY：Settings → Secrets and variables → Actions → New repository secret"
              );
              return;
            }

            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const isComment = Boolean(comment);

            // 触发词只是唤醒用，从正文里去掉
            const clean = (text) =>
              (text ?? "").replace(/@deepseek/gi, "").replace(/@infer/gi, "").trim();

            const userText = isComment
              ? [
                  `Issue 标题：${issue.title}`,
                  "",
                  "Issue 原文：",
                  clean(issue.body) || "（无）",
                  "",
                  "用户这次的追问：",
                  clean(comment.body),
                ].join("\n")
              : [`Issue 标题：${issue.title}`, "", clean(issue.body) || "（无正文）"].join("\n");

            // 把仓库文档一起喂给模型，避免它凭空编造本仓库的约定
            const readDoc = async (path) => {
              try {
                const r = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                });
                return Buffer.from(r.data.content, "base64").toString("utf8");
              } catch {
                return "";
              }
            };

            const readme = (await readDoc("README.md")).slice(0, 20000);
            const contributing = (await readDoc("CONTRIBUTING.md")).slice(0, 15000);
            const docs = [
              "【本仓库 README.md 摘录】",
              readme || "（读取失败）",
              "",
              "【本仓库 CONTRIBUTING.md 摘录】",
              contributing || "（读取失败）",
            ].join("\n");

            const system = [
              "你是「初高中物理演示课件仓库」的中文答疑助手，读者主要是中学物理老师和学生。",
              "",
              "要求：",
              "1. 直接回答用户的问题，输出完整、可独立阅读的答案。",
              "2. 物理内容必须准确：公式、方向、单位、正负号要经得起检查；不确定就明说「不确定」，不要编造。",
              "3. 回答控制在 400 字以内；需要时用短列表或公式。",
              "4. 只输出答案本身，不要复述题目，不要写「无需进一步操作」「任务完成」「请查阅文档」这类话。",
              "5. 涉及本仓库的问题（投稿流程、目录命名、许可、收录标准），以下面的文档为准；文档没写的部分不要编造，直接说「文档里没有写，建议在 Issue 里问维护者」。",
              "6. 不要推荐与文档冲突的做法（例如文档同时接受 MIT 和 CC BY-SA 4.0 时，不要只说其中一种）。",
              "",
              docs,
            ].join("\n");

            let res;
            try {
              res = await fetch("https://api.deepseek.com/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${key}`,
                },
                body: JSON.stringify({
                  model: "deepseek-chat",
                  temperature: 0.3,
                  max_tokens: 1200,
                  messages: [
                    { role: "system", content: system },
                    { role: "user", content: userText },
                  ],
                }),
              });
            } catch (error) {
              core.setFailed(`请求 DeepSeek 失败：${error.message}`);
              return;
            }

            if (!res.ok) {
              const detail = (await res.text()).slice(0, 500);
              core.setFailed(`DeepSeek 接口返回 ${res.status}：${detail}`);
              return;
            }

            const data = await res.json();
            const answer = data?.choices?.[0]?.message?.content?.trim();
            if (!answer) {
              core.setFailed("模型没有返回内容");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: answer,
            });

            core.info(`已在 #${issue.number} 发布回答（${answer.length} 字）`);
