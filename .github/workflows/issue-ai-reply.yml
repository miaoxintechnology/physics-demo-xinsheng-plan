name: AI Reply on Issues & Comments

# 新 Issue（opened）会尝试自动回复；后续评论需要 @infer 才回复。
# 注意：infer-action 的 issues 触发器同样要求在标题或正文中出现 @infer，
# 详见 README「AI 自动回复」一节。
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  # AI 需要写权限才能建分支、提交文件并开 PR；只回复评论时可以改回 read
  contents: write
  issues: write
  pull-requests: write

# 并发按「Issue + 提问人」分组：
# - 别人在同一个 Issue 里提问，不会顶掉你的那次运行；
# - 你自己连发两条，新的会替换掉自己还没跑完的那条，不会堆积、不会互相覆盖。
concurrency:
  group: ai-reply-${{ github.event.issue.number }}-${{ github.event.sender.login }}
  cancel-in-progress: true

jobs:
  ai-reply:
    # 1. 不响应 Bot 自己的评论/事件，防止循环触发
    # 2. 只处理 Issue：PR 评论（issue.pull_request 非空）直接跳过，
    #    因此本工作流不会检出、也不会执行任何 PR 分支上的代码
    # 3. 评论必须包含触发短语 @infer 才进入任务（Issue 新建时不限）
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request == null &&
      (github.event_name != 'issue_comment' || contains(github.event.comment.body, '@infer'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Infer CLI 启动内置 gateway 时要访问 GitHub API 下载产物；
      # 带上 token 可以避开共享 runner IP 的低额度匿名限流（偶发 403）。
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出仓库（仅默认分支）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 检查 DEEPSEEK_API_KEY
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::仓库尚未配置 DEEPSEEK_API_KEY，无法调用模型。"
            echo "请在 Settings → Secrets and variables → Actions 中添加 Repository secret：DEEPSEEK_API_KEY"
            exit 1
          fi

      - name: 调用 Infer agent 生成回复
        uses: inference-gateway/infer-action@v0.23.6
        with:
          # 用 GITHUB_TOKEN 发评论、建分支、开 PR，无需额外 PAT
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: deepseek/deepseek-flash
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          # 触发短语保持默认的 @infer，无需显式传入
          custom-instructions: |
            你是「初高中物理演示课件仓库」的中文答疑助手，读者主要是中学物理老师和学生。

            行为要求：
            1. 默认把 Issue / 评论当作提问：直接、简洁地用中文回答，答案会作为 Issue 评论发布。
            2. 只有用户明确要求「改代码 / 修课件 / 提交 PR」时，才去修改文件、建分支、开 PR。
            3. 纯提问（物理知识、课件用法、投稿流程等）直接回答，不要为此做仓库调查：不要读大量文件、不要跑 git/gh 命令、不要查 Actions 日志、不要试图验证这次运行本身。只有用户明确要求「改代码 / 看仓库具体实现 / 排查 CI」时才去读文件或跑命令。
            4. 物理内容必须准确：公式、方向、单位、正负号要经得起检查；不确定就说「不确定」，不要编造。
            5. 回答控制在 400 字以内；需要时用短列表或公式说明，不要大段铺陈。
            6. 结尾不要写「任务完成」「Done」之类的过程话术，直接给结论。

      # infer-action 默认只保留一条滚动评论：下一轮开始时，它会删掉正文含
      # "I'm cooking" 的旧评论，再把自己的评论改写成新结果，于是历史回答会被覆盖。
      # 这里在每轮结束后把该占位语抹掉，让这条评论不再命中清理条件，
      # 每轮回答就都留在 Issue 里，形成完整问答记录。
      - name: 归档本轮回复，保留历史
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const PLACEHOLDER = "I'm cooking...will get back to you soon...";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            let archived = 0;
            for (const c of comments) {
              if (c.user?.login !== "github-actions[bot]") continue;

              const body = c.body ?? "";
              // 只归档已经写出结果的评论；中途崩掉、只有占位语的留给下一轮清掉
              if (!body.includes(PLACEHOLDER) || !body.includes("infer:result-start")) continue;

              const cleaned = body
                .split(PLACEHOLDER)
                .join("")
                .replace(/\n{3,}/g, "\n\n")
                .trim();

              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: c.id,
                body: cleaned,
              });
              archived += 1;
            }

            core.info(`已归档 ${archived} 条回复（本轮之后它们不会再被清理）`);
