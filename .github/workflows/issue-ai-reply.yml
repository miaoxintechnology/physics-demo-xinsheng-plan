name: AI Reply on Issues & Comments

# 新 Issue（opened）自动回复；后续评论需要 @infer 才回复。
# 实现方式：直接把问题发给 DeepSeek 接口，把回答作为评论发出。
# 不走 agent 循环，因此不会出现「无需进一步操作」这类空回答，
# 也不会去读仓库文件、跑 git/gh、或改动代码。
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  # 只发评论，不需要写代码，所以 contents 保持只读
  contents: read
  issues: write
  pull-requests: write

# 同一 Issue 串行排队，不取消已开始的运行：谁都不会被顶掉，每条提问最终都有回答
concurrency:
  group: ai-reply-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    # 1. 不响应 Bot，防止循环
    # 2. 只处理 Issue，不碰 PR（也不检出任何 PR 代码）
    # 3. 评论必须含 @infer
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request == null &&
      (github.event_name != 'issue_comment' || contains(github.event.comment.body, '@infer'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 向 DeepSeek 提问并回复
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const key = process.env.DEEPSEEK_API_KEY;
            if (!key) {
              core.setFailed(
                "仓库未配置 DEEPSEEK_API_KEY：Settings → Secrets and variables → Actions → New repository secret"
              );
              return;
            }

            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const isComment = Boolean(comment);

            // @infer 只是唤醒词，从正文里去掉，避免模型把它当成内容
            const clean = (text) => (text ?? "").replace(/@infer/gi, "").trim();

            const userText = isComment
              ? [
                  `Issue 标题：${issue.title}`,
                  "",
                  "Issue 原文：",
                  clean(issue.body) || "（无）",
                  "",
                  "用户这次的追问：",
                  clean(comment.body),
                ].join("\n")
              : [`Issue 标题：${issue.title}`, "", clean(issue.body) || "（无正文）"].join("\n");

            const system = [
              "你是「初高中物理演示课件仓库」的中文答疑助手，读者主要是中学物理老师和学生。",
              "",
              "要求：",
              "1. 直接回答用户的问题，输出完整、可独立阅读的答案。",
              "2. 物理内容必须准确：公式、方向、单位、正负号要经得起检查；不确定就明说「不确定」，不要编造。",
              "3. 回答控制在 400 字以内；需要时用短列表或公式。",
              "4. 只输出答案本身，不要复述题目，不要写「无需进一步操作」「任务完成」「请查阅文档」这类话。",
              "5. 如果问题涉及本仓库（投稿流程、目录命名、课件规范），按 README 与 CONTRIBUTING 的约定回答。",
            ].join("\n");

            let res;
            try {
              res = await fetch("https://api.deepseek.com/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${key}`,
                },
                body: JSON.stringify({
                  model: "deepseek-chat",
                  temperature: 0.3,
                  max_tokens: 1200,
                  messages: [
                    { role: "system", content: system },
                    { role: "user", content: userText },
                  ],
                }),
              });
            } catch (error) {
              core.setFailed(`请求 DeepSeek 失败：${error.message}`);
              return;
            }

            if (!res.ok) {
              const detail = (await res.text()).slice(0, 500);
              core.setFailed(`DeepSeek 接口返回 ${res.status}：${detail}`);
              return;
            }

            const data = await res.json();
            const answer = data?.choices?.[0]?.message?.content?.trim();
            if (!answer) {
              core.setFailed("模型没有返回内容");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: answer,
            });

            core.info(`已在 #${issue.number} 发布回答（${answer.length} 字）`);
