name: AI Code Agent

# 代码通道：Issue / PR 评论里 @infer 触发 infer-action，
# 可以读仓库、改文件、建分支并开 PR。
# 纯答疑请用 @deepseek（issue-ai-reply.yml），避免 agent 把提问当成任务。
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  # 这条通道真的要写仓库，所以需要 contents: write
  contents: write
  issues: write
  pull-requests: write

# 同一 Issue 串行，避免两次运行同时改分支
concurrency:
  group: ai-code-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    # 新 Issue 正文写 @infer，或 Issue / PR 评论里写 @infer 才触发
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'issues' &&
        contains(github.event.issue.body, '@infer')) ||
       (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@infer')))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 解析检出目标
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.issue?.pull_request;
            if (!pr) {
              // Issue：在默认分支上工作
              core.setOutput("ref", context.payload.repository.default_branch);
              core.setOutput("isFork", "false");
              return;
            }
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            const isFork = Boolean(data.head.repo?.fork);
            core.setOutput("isFork", String(isFork));
            // 同仓库 PR 检出它的 head 分支，可以直接改；fork PR 只在默认分支上只读分析
            core.setOutput(
              "ref",
              isFork ? context.payload.repository.default_branch : data.head.ref
            );

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: 检查 DEEPSEEK_API_KEY
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::仓库尚未配置 DEEPSEEK_API_KEY，无法调用模型。"
            exit 1
          fi

      - name: 调用 Infer agent 执行改动
        uses: inference-gateway/infer-action@v0.23.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: deepseek/deepseek-flash
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          # 触发短语保持默认的 @infer
          # 这是「干活」通道：用户明确要求改代码时才应该走到这里，
          # 所以保留 action 默认的工程化系统提示，只补充一点边界说明。
          custom-instructions: |
            用户用 @infer 明确请求你修改仓库内容。请按最小改动原则完成：
            - 需要改哪个课件目录就只改那个目录，不要顺手重构无关文件；
            - 改完说明改了什么、为什么改；
            - 如果用户的要求其实不需要改代码（例如只是提问），不要改任何文件，
              直接用评论说明「这个问题适合用 @deepseek 提问」，并给出答案要点。

      # infer-action 只保留一条滚动评论：下一轮开始会删掉正文含 "I'm cooking" 的旧评论，
      # 于是历史结果会被覆盖。这里在每轮结束后抹掉该占位语，让每轮结果都留下来。
      - name: 归档本轮结果，保留历史
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const PLACEHOLDER = "I'm cooking...will get back to you soon...";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            let archived = 0;
            for (const c of comments) {
              if (c.user?.login !== "github-actions[bot]") continue;
              const body = c.body ?? "";
              if (!body.includes(PLACEHOLDER) || !body.includes("infer:result-start")) continue;

              const cleaned = body
                .split(PLACEHOLDER)
                .join("")
                .replace(/\n{3,}/g, "\n\n")
                .trim();

              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: c.id,
                body: cleaned,
              });
              archived += 1;
            }

            core.info(`已归档 ${archived} 条结果`);
